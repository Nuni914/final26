<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Originals</title>
    <link href="../styles/mobiles.css" rel="stylesheet" type="text/css">
    <link href="../styles/inspiration.css" rel="stylesheet" type="text/css">
</head>
<body>
        <div id="nav-placeholder"></div>
    <script>

    fetch('navbar.html')

    .then(response => response.text())

    .then(data => {

    document.getElementById('nav-placeholder').innerHTML = data;

    // Wait until nav.html is loaded, THEN attach toggle behavior

    const toggleButton = document.getElementsByClassName('toggle-button')[0];

    const navbarLinks = document.getElementsByClassName('teddy')[0];

    if (toggleButton && navbarLinks) {

    toggleButton.addEventListener('click', () => {

    navbarLinks.classList.toggle('active');

    });

    }

    });

    </script>
<main>
    <body class="pure-g">
        <div class="image-container">
            <section class="pure-u-1-3">
                <img src="../images/mag1.jpg" alt="end zone article">
            </section>
            <section class="pure-u-1-3">
                <img src="../images/mag2.jpg" alt="conversation article">
            </section>
            <section class="pure-u-1-3">
                <img src="../images/mag3.jpg" alt="sanctuary article">
            </section>
            <section class="pure-u-1">
                <img src="../images/mags.jpg" alt="prep of all articles">
            </section>
        </div>
    </body>
</main>
</body>
</html>
